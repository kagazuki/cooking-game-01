<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Culinary Rush: 5-Star Master Chef</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #14171f; font-family: "Segoe UI", system-ui, sans-serif; }
  #game { position: fixed; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; }
  #status { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap; }
</style>
</head>
<body>
<canvas id="game" width="1280" height="720" aria-label="Culinary Rush: Cook, assemble, and serve gourmet dishes under kitchen rush hour pressure"></canvas>
<p id="status" role="status" aria-live="polite">Culinary Rush cooking kitchen simulation game loaded</p>
<script type="module" src="./src/main.js"></script>
</body>
</html>
